<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="mermaid.min.js"></script>
    <style>body { margin: 0; }</style>
  </head>
  <body>
    <script>
      // securityLevel 'strict' disables click handlers and inline HTML in
      // labels. Diagrams come from a synced repository, so they are treated as
      // untrusted input.
      function setup(theme) {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: 'base',
          themeVariables: JSON.parse(theme),
          fontFamily: 'sans-serif',
          // Labels as SVG <text>, not HTML in a <foreignObject>.
          //
          // mermaid's default puts a <div> inside the SVG, which a browser
          // draws and an SVG renderer does not -- so the diagram arrived with
          // its boxes and arrows and not one word in it. <br> still breaks a
          // line, which is what the vault's diagrams are written with.
          htmlLabels: false,
          flowchart: { htmlLabels: false }
        });
      }

      // Started here, collected by polling `result`.
      //
      // `evaluateJavascript` hands back the JSON encoding of whatever the
      // expression evaluates to, and it does not wait on promises. An `async`
      // function here therefore returned a Promise, which encodes as `{}` --
      // an object with no `ok` in it, so every diagram ever rendered was
      // reported as invalid and shown as its own source.
      // One text node per line, instead of one tspan per word.
      //
      // mermaid splits a label into a tspan per word and puts the separating
      // space at the *start* of the next one -- `<tspan>Write</tspan><tspan>
      // Model</tspan>`. SVG's default whitespace handling strips leading
      // whitespace from each chunk, so a strict renderer draws
      // "WriteModel". Browsers are lenient and mermaid relies on it; the
      // image loader that actually draws these is not a browser.
      //
      // Joining each line back into one string keeps the spaces, and the
      // line breaks survive because mermaid already gives each line its own
      // outer tspan.
      function flatten(svgText) {
        var doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
        doc.querySelectorAll('tspan.text-outer-tspan').forEach(function (row) {
          row.textContent = row.textContent;
          row.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
        });
        return new XMLSerializer().serializeToString(doc);
      }

      function render(id, code) {
        window.__result = null;
        mermaid
          .render('d' + id, code)
          .then(function (out) {
            window.__result = JSON.stringify({ ok: true, svg: flatten(out.svg) });
          })
          .catch(function (e) {
            window.__result = JSON.stringify({ ok: false, error: String((e && e.message) || e) });
          });
        return 'started';
      }

      function result() {
        return window.__result;
      }
    </script>
  </body>
</html>
