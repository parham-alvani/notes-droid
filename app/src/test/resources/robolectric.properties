# Robolectric needs Java 21 to sandbox SDK 37, and AGP 9 pins the build to
# Java 17. The emulated runtime does not have to match compileSdk, so the tests
# run against 34 -- comfortably above this app's minSdk of 29 and close enough
# to be representative.
sdk=34

# A plain Application, not NotesApplication. No test here uses Hilt, and the
# real one starts collectors on the shared settings store at every boot and
# never stops them -- one set per test, all in one process, watching and
# writing the same file. That pile-up is what made PinViewModelTest hang for
# a minute on a slow CI runner.
application=android.app.Application
